name: Setup
description: Install the mise toolchain (node, rust, aube) and Node.js dependencies. Callers set MISE_ENV (e.g. ci, or ci,release) on the job and own any extra caches.

inputs:
  cache:
    description: Restore and save the mise tool cache. Set to "false" in release jobs to avoid cache poisoning.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Re-verify tool provenance on every install and refuse unregistered plugins.
    # (paranoid's `config` category is left off: it needs content-bound trust of every config file.)
    - shell: bash
      run: echo "MISE_PARANOID=plugins,provenance" >> "$GITHUB_ENV"

    # Installs the tools pinned in mise.toml (and mise.<env>.toml); mise.lock triggers `mise install --locked`.
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        version: 2026.11.9
        cache: ${{ inputs.cache }}

    - shell: bash
      run: mise deps install aube
