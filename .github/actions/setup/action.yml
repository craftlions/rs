name: Setup
description: Install the mise toolchain (node, rust, aube) and Node.js dependencies. Callers pick the mise environment with the mise-env input and own any extra caches.

inputs:
  mise-env:
    description: mise environment(s) to load, e.g. "ci" or "ci,release". Exported as MISE_ENV to every later step in the job.
    required: true
  cache:
    description: Restore and save the mise tool cache. Set to "false" in release jobs to avoid cache poisoning.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Re-verify tool provenance on every install and refuse unregistered plugins.
    # (paranoid's `config` category is left off: it needs content-bound trust of every config file.)
    - shell: bash
      run: echo "MISE_PARANOID=plugins,provenance" >> "$GITHUB_ENV"

    # Installs the tools pinned in mise.toml (and mise.<env>.toml); mise.lock triggers `mise install --locked`.
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: 2026.11.12
        mise_env: ${{ inputs.mise-env }}
        cache: ${{ inputs.cache }}

    - shell: bash
      run: mise deps install aube
