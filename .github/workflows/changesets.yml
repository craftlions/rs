name: Changesets

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  version:
    name: Version packages
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: write # changesets/action commits the version bump to the release branch
      pull-requests: write # changesets/action opens and updates the "Version Packages" PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/.github/actions/setup
        with:
          cache: false
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          create-github-releases: false
