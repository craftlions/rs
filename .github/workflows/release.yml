name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: write
  checks: write
  contents: write
  deployments: write
  id-token: write
  issues: write
  discussions: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-26
            target: aarch64-apple-darwin
            folder: darwin-arm64
          - host: macos-26
            target: x86_64-apple-darwin
            folder: darwin-x64
          - host: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            folder: linux-x64-gnu
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            folder: win32-x64-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/.github/actions/setup
        with:
          rust-target: ${{ matrix.target }}
          cache: false
      - run: mise run build "$RUST_TARGET"
        env:
          RUST_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodes-${{ matrix.target }}
          path: |
            *.node
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nodes-*
          merge-multiple: true
      - uses: $/.github/actions/setup
        with:
          cache: false
      - run: aube exec -- napi create-npm-dirs
      - run: aube exec -- napi artifacts -o .
      - run: node scripts/binaries.mjs
      # prepublishOnly runs `napi prepublish`, which publishes the platform packages with npm (OIDC).
      - run: aube publish --no-git-checks --provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
