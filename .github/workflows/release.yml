name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: write
  checks: write
  contents: write
  deployments: write
  id-token: write
  issues: write
  discussions: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-15
            target: aarch64-apple-darwin
            folder: darwin-arm64
          - host: macos-15
            target: x86_64-apple-darwin
            folder: darwin-x64
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            folder: linux-x64-gnu
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            folder: win32-x64-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: $/.github/actions/setup
        with:
          rust-target: ${{ matrix.target }}
          cache: false
      - run: mise run build "$RUST_TARGET"
        env:
          RUST_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodes-${{ matrix.target }}
          path: |
            *.node
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nodes-*
          merge-multiple: true
      - uses: $/.github/actions/setup
        with:
          cache: false
      - run: aube exec -- napi create-npm-dirs
      - run: aube exec -- napi artifacts -o .
      - run: node scripts/binaries.mjs
      # prepublishOnly runs `napi prepublish`, which publishes the platform packages with npm (OIDC).
      - run: aube publish --no-git-checks --provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
