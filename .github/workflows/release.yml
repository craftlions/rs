name: Release

on:
  # Pushed by hand, or dispatched by changesets.yml with --ref vX.Y.Z after the release PR merges.
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check release tag
    env:
      MISE_ENV: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    cache-mode: none
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - name: Tag matches package.json and Cargo.toml
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "::error::Release must run on tag v$version, not $GITHUB_REF"
            exit 1
          fi
          mise run check-version

  build:
    name: Build ${{ matrix.target }}
    needs: check
    env:
      MISE_ENV: ci,release
    timeout-minutes: 45
    # Releases never restore caches, so a poisoned cache cannot reach published artifacts.
    cache-mode: none
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-26
            target: aarch64-apple-darwin
            folder: darwin-arm64
          - host: macos-26
            target: x86_64-apple-darwin
            folder: darwin-x64
          - host: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            folder: linux-x64-gnu
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            folder: win32-x64-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - run: mise run build "$RUST_TARGET"
        env:
          RUST_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodes-${{ matrix.target }}
          path: |
            *.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    env:
      MISE_ENV: ci
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    cache-mode: none
    # The npm trusted publisher is bound to this environment, so only runs it approves can publish.
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nodes-*
          merge-multiple: true
      - uses: $/.github/actions/setup
        with:
          cache: false
      # Downloads the binaries pinned in pdfium.lock.json and fails on a checksum mismatch.
      - run: mise deps install pdfium
      - run: aube exec -- napi create-npm-dirs
      - run: aube exec -- napi artifacts -o .
      # Crate sources for the license notices (and the SBOM).
      - run: mise run fetch
      # Adds libpdfium, LICENSE and the PDFium and Rust crate license notices to each platform package.
      - run: node scripts/prepare-packages.ts
      # npm graph + platform packages + Rust crates + PDFium; generated before publishing so a failure stops the release.
      - name: Generate SBOM
        run: node scripts/sbom.ts sbom.cdx.json
      # prepublishOnly runs `napi prepublish`, which publishes the platform packages with npm (OIDC).
      - run: aube publish --no-git-checks --provenance
        env:
          NPM_CONFIG_PROVENANCE: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  verify:
    name: Verify publish trust evidence
    env:
      MISE_ENV: ci
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    cache-mode: none
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      # Downstream aube/pnpm users reject versions whose trust evidence is weaker than earlier releases.
      # New versions can take several minutes to appear in the npm packument (0.1.0: ~3 minutes), so retry
      # for up to 10 minutes per package; packages that are already visible pass on the first attempt.
      - name: aube trust check
        run: |
          version="$(node -p 'require("./package.json").version')"
          attempts=20
          for pkg in @craftlions/pdfium-rs @craftlions/pdfium-rs-darwin-arm64 @craftlions/pdfium-rs-darwin-x64 \
            @craftlions/pdfium-rs-linux-x64-gnu @craftlions/pdfium-rs-win32-x64-msvc; do
            for attempt in $(seq "$attempts"); do
              if aube trust check "$pkg@$version"; then break; fi
              if [ "$attempt" -eq "$attempts" ]; then exit 1; fi
              echo "::notice::$pkg@$version not verifiable yet (attempt $attempt/$attempts), retrying in 30s"
              sleep 30
            done
          done

  github-release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    cache-mode: none
    permissions:
      contents: write # create the release for the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - name: Create release from the CHANGELOG.md section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          # The section between "## <version>" and the next "## " heading.
          awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          gh release create "v$version" sbom.cdx.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$version" --notes-file notes.md
