[package]
name = "pdfium"
version = "0.0.5"
edition = "2024"
rust-version = "1.100"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.2", features = ["napi10"] }
napi-derive = "3.7.1"
pdfium-render = { version = "0.9.5" }
image = "0.25.10"
url = "2.5.9"

[build-dependencies]
napi-build = "2.6.0"
