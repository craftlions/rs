[package]
name = "pdfium"
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.3", features = ["napi10"] }
napi-derive = "3.7.2"
pdfium-render = { version = "0.9.5" }
image = "0.25.10"
url = "2.5.9"

[build-dependencies]
napi-build = "2.7.0"

[lints.rust]
unused_qualifications = "warn"
rust_2024_compatibility = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Casting rendered pixel sizes from f32 is intentional.
cast_possible_truncation = "allow"
# `#[napi]` functions take owned values by design.
needless_pass_by_value = "allow"
# "PDFium" is a product name, not a code identifier.
doc_markdown = "allow"

[lints.cargo]
unused_dependencies = "warn"
