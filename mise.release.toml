# Loaded by the release build jobs via `mise_env: ci,release` (MISE_ENV=ci,release).
# Keep the version in sync with mise.toml.

[tools]
rust = { version = "1.100.0", profile = "default", targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
] }
