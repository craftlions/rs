# aube project policy (https://aube.sh/settings)

# Supply-chain hardening bundle: jailed + strict dependency builds, trustPolicy=no-downgrade,
# strict minimum release age, strict store integrity and a required OSV advisory check.
paranoid: true

# Do not resolve npm versions published less than 3 days ago (4320 minutes), matching mise.
minimumReleaseAge: 4320

# Only the allowBuilds list below may run dependency lifecycle scripts; aube's built-in
# trusted-dependencies list is ignored. Review with `aube ignored-builds` / `aube approve-builds`.
useDefaultTrustedDependencies: false
allowBuilds: {}

# Check against OSV on every install, also when node_modules is restored from a cache.
advisoryBloomCheck: "on"
advisoryCheckEveryInstall: true
