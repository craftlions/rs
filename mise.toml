[tools]
node = "26.13.1"
aube = "2.10.1"
rust = { version = "1.100.0", profile = "default" }
jactionlint = "2.6.0"
shellcheck = "0.11.0"

[settings]
experimental = true
lockfile = true
# Do not install tool versions published less than 3 days ago (supply-chain protection).
minimum_release_age = "3d"

[env]
# Call napi, tsc and changeset directly in tasks.
_.path = ["{{config_root}}/node_modules/.bin"]

[hooks]
postinstall = "aube install"

[tasks.install]
description = "Install Node.js dependencies from the lockfile"
hide = true
run = "aube install --frozen-lockfile"

[tasks.build]
description = "Build the native addon for the host platform"
alias = "b"
depends = ["install"]
usage = 'arg "[target]" help="Rust target triple (defaults to host)"'
sources = [
  "src/**/*.rs",
  "Cargo.lock",
  "Cargo.toml",
  "build.rs",
  "package.json",
]
outputs = ["pdfium.*.node"]
run = "napi build --platform --release --format esm {% if usage.target %}--target {{usage.target}}{% endif %}"

[tasks.test]
description = "Run the node:test suite against sample.pdf"
alias = "t"
depends = ["build", "local-pdfium"]
deny_net = true
run = "node --test test.js"

[tasks.fetch]
description = "Download Rust crates so sandboxed tasks can run offline"
hide = true
run = "cargo fetch --locked"

[tasks.lint]
description = "Run clippy with the Cargo.toml lint configuration (warnings are errors)"
alias = "l"
depends = ["fetch"]
deny_net = true
run = "cargo clippy --all-targets --locked --offline -- -D warnings"

[tasks.typecheck]
description = "Type-check TypeScript sources with tsc (TypeScript 7)"
alias = "tc"
depends = ["install"]
deny_net = true
run = "tsc --noEmit -p ."

[tasks.changeset]
description = "Add a changeset non-interactively (bump: patch|minor|major)"
depends = ["install"]
usage = '''
arg "<bump>" help="Version bump" { choices "patch" "minor" "major" }
arg "<summary>" help="Changelog summary"
'''
run = "changeset add --{{usage.bump}} @craftlions/pdfium-rs --message '{{usage.summary}}'"
