min_version = "2026.11.9"

[tools]
node = "26.13.1"
aube = "2.10.1"
rust = { version = "1.100.0", profile = "default" }
# Workflow linting only; not needed on the Windows release runner.
jactionlint = { version = "2.6.0", os = ["linux", "macos"] }
shellcheck = { version = "0.11.0", os = ["linux", "macos"] }

[settings]
experimental = true
lockfile = true
# Install exactly the versions and download URLs recorded in mise.lock.
locked = true
lockfile_platforms = ["macos-arm64", "macos-x64", "linux-x64", "windows-x64"]
# Do not install tool versions published less than 3 days ago (supply-chain protection).
minimum_release_age = "3d"

[settings.skills]
# Link agent skills shipped by tools (e.g. aube) into .agents/skills and .claude/skills.
auto_sync = true
dir = ".agents/skills"
prune = true

[env]
# Call napi, tsc and changeset directly in tasks.
_.path = ["{{config_root}}/node_modules/.bin"]

# Install Node.js dependencies before `mise run` / `mise exec` when package.json or aube-lock.yaml changed.
[deps.aube]
auto = true
run = "aube install --frozen-lockfile"

# Download and checksum-verify the PDFium binaries pinned in pdfium.lock.json: `mise deps install pdfium`.
# Change the pin with `mise run update-pdfium`.
[deps.pdfium]
description = "PDFium binaries pinned in pdfium.lock.json"
sources = ["pdfium.lock.json", "scripts/install-pdfium.ts"]
outputs = [
  "vendor/pdfium/darwin-arm64/libpdfium.dylib",
  "vendor/pdfium/darwin-x64/libpdfium.dylib",
  "vendor/pdfium/linux-x64-gnu/libpdfium.so",
  "vendor/pdfium/win32-x64-msvc/pdfium.dll",
]
run = "node scripts/install-pdfium.ts"

[tasks.build]
description = "Build the native addon for the host platform"
alias = "b"
usage = 'arg "[target]" help="Rust target triple (defaults to host)"'
sources = [
  "src/**/*.rs",
  "Cargo.lock",
  "Cargo.toml",
  "build.rs",
  "package.json",
]
outputs = ["pdfium.*.node", "index.js", "index.d.ts"]
run = "napi build --platform --release --format esm {% if usage.target %}--target {{usage.target}}{% endif %}"

[tasks.test]
description = "Run the node:test suite against sample.pdf"
alias = "t"
depends = ["build", "local-pdfium"]
deny_net = true
run = "node --test test.js"

[tasks.fetch]
description = "Download Rust crates so sandboxed tasks can run offline"
hide = true
run = "cargo fetch --locked"

[tasks.lint]
description = "Run clippy with the Cargo.toml lint configuration (warnings are errors)"
alias = "l"
depends = ["fetch"]
deny_net = true
run = "cargo clippy --all-targets --locked --offline -- -D warnings"

[tasks.typecheck]
description = "Type-check TypeScript sources with tsc (TypeScript 7)"
alias = "tc"
deny_net = true
run = "tsc --noEmit -p ."

[tasks.changeset]
description = "Add a changeset non-interactively (bump: patch|minor|major)"
usage = '''
arg "<bump>" help="Version bump" { choices "patch" "minor" "major" }
arg "<summary>" help="Changelog summary"
'''
run = "changeset add --{{usage.bump}} @craftlions/pdfium-rs --message '{{usage.summary}}'"

[tasks.version]
description = "Apply changesets: bump package.json, write CHANGELOG.md and sync the Cargo.toml version"
run = ["changeset version", "node scripts/sync-version.ts"]

[tasks.check-version]
description = "Fail when Cargo.toml and package.json versions differ"
hide = true
run = "node scripts/sync-version.ts --check"

[tasks.sbom]
description = "Write the CycloneDX SBOM of the release: npm graph, platform packages, Rust crates and PDFium"
depends = ["fetch"]
usage = 'arg "[out]" default="sbom.cdx.json" help="Output path"'
run = "node scripts/sbom.ts {{usage.out}}"
